<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#913b48"><title>ГЭРЭЛТ — Хятад хэл</title>
<style>
:root{--r:#913b48;--g:#c99b4b;--bg:#fffaf1;--ink:#332b2b;--line:#eadfd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(120deg,#7f2e3c,#ad5c58);color:white;padding:24px 18px;border-radius:0 0 24px 24px}.wrap{max-width:900px;margin:auto;padding:0 15px}.brand{letter-spacing:3px;color:#f5dcae;font-size:13px}h1{font-size:32px;margin:8px 0 2px}.pill{display:inline-block;background:#fff2df;color:#7f2e3c;border-radius:25px;padding:5px 11px;font-size:12px;font-weight:bold}nav{display:flex;gap:8px;overflow:auto;padding:14px 0}button{border:0;border-radius:12px;padding:11px 14px;background:#f1e6dc;color:var(--ink);font-weight:700;cursor:pointer}nav button.active,.primary{background:var(--r);color:white}main{padding:10px 0 40px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fffdf9;cursor:pointer}.emoji{font-size:28px}.muted{color:#766d68;font-size:14px}.hanzi{font-size:34px;color:var(--r);font-weight:800}.pinyin{font-size:19px;color:#986c29;font-weight:700}.word,.dialogue{padding:12px;border-radius:12px;background:#fff8ed;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>div:first-child{flex:1}.dialogue{background:#faf4ee}.dialogue b{color:var(--r)}footer{text-align:center;color:#766d68;font-size:12px;padding:20px}
</style></head><body><header><div class="wrap"><div class="brand">中文学习 · MONGOLIAN</div><h1>🌸 ГЭРЭЛТ</h1><p>Хятад хэлийг өдөр тутмын амьдрал дээр сурцгаая.</p><span class="pill">АНХАН ШАТ · HSK 1</span></div></header><div class="wrap"><nav id="nav"><button class="active" data-p="home">Нүүр</button><button data-p="lessons">Сэдэвт хичээл</button><button data-p="words">Шинэ үгс</button><button data-p="practice">Яриа давтах</button><button data-p="quiz">Өөрийгөө шалгах</button></nav><main id="app"></main><footer>ГЭРЭЛТ · Хятад хэлний сургалтын туршилтын хувилбар</footer></div>
<script>
const L=[
{id:'train',e:'🚄',t:'Галт тэрэг',d:'Тасалбар, суудал, чиглэл асуух',w:[['火车','huǒchē','галт тэрэг'],['火车站','huǒchēzhàn','галт тэрэгний буудал'],['票','piào','тасалбар'],['几点','jǐ diǎn','хэдэн цаг'],['座位','zuòwèi','суудал'],['去','qù','явах'],['到','dào','хүрэх'],['哪里','nǎlǐ','хаана']],c:[['工作人员','请问，你要去哪儿？','Qǐngwèn, nǐ yào qù nǎr?','Та хаашаа явах вэ?'],['乘客','我要去北京。','Wǒ yào qù Běijīng.','Би Бээжин явна.'],['工作人员','一张票吗？','Yì zhāng piào ma?','Нэг тасалбар уу?']]},
{id:'tea',e:'🍵',t:'Цайны газар',d:'Цай, хоол захиалах, тооцоо хийх',w:[['茶','chá','цай'],['水','shuǐ','ус'],['菜单','càidān','цэс'],['米饭','mǐfàn','агшаасан будаа'],['多少钱','duōshao qián','хэдэн юань'],['我要','wǒ yào','би авъя'],['好吃','hǎochī','амттай'],['买单','mǎidān','тооцоо хийх']],c:[['顾客','你好，我要一杯茶。','Nǐ hǎo, wǒ yào yì bēi chá.','Сайн байна уу, нэг аяга цай авъя.'],['服务员','还要别的吗？','Hái yào bié de ma?','Өөр зүйл авах уу?'],['顾客','不要了，谢谢。','Bú yào le, xièxie.','Өөр хэрэггүй, баярлалаа.']]},
{id:'shop',e:'🛍️',t:'Дэлгүүр',d:'Үнэ асуух, бараа сонгох',w:[['商店','shāngdiàn','дэлгүүр'],['这个','zhège','энэ'],['多少钱','duōshao qián','ямар үнэтэй вэ'],['太贵了','tài guì le','хэт үнэтэй'],['便宜','piányi','хямд'],['喜欢','xǐhuan','дуртай'],['买','mǎi','худалдаж авах']],c:[['顾客','这个多少钱？','Zhège duōshao qián?','Энэ ямар үнэтэй вэ?'],['店员','三十块。','Sānshí kuài.','30 юань.'],['顾客','可以便宜一点吗？','Kěyǐ piányi yìdiǎn ma?','Жаахан хямдруулж болох уу?']]},
{id:'hotel',e:'🏨',t:'Зочид буудал',d:'Өрөө захиалах, бүртгүүлэх',w:[['酒店','jiǔdiàn','зочид буудал'],['房间','fángjiān','өрөө'],['预订','yùdìng','захиалах'],['护照','hùzhào','паспорт'],['一晚','yì wǎn','нэг шөнө'],['名字','míngzi','нэр']],c:[['客人','你好，我预订了房间。','Nǐ hǎo, wǒ yùdìng le fángjiān.','Би өрөө захиалсан.'],['前台','请给我看一下护照。','Qǐng gěi wǒ kàn yíxià hùzhào.','Паспортоо үзүүлнэ үү.']]},
{id:'hospital',e:'🏥',t:'Эмнэлэг',d:'Зовиур хэлэх, эмчид үзүүлэх',w:[['医院','yīyuàn','эмнэлэг'],['医生','yīshēng','эмч'],['护士','hùshi','сувилагч'],['疼','téng','өвдөх'],['头','tóu','толгой'],['肚子','dùzi','гэдэс'],['药','yào','эм'],['不舒服','bù shūfu','бие тавгүй']],c:[['病人','医生，我不舒服。','Yīshēng, wǒ bù shūfu.','Эмч ээ, миний бие тавгүй байна.'],['医生','你哪里疼？','Nǐ nǎlǐ téng?','Хаана өвдөж байна?'],['病人','我的头疼。','Wǒ de tóu téng.','Миний толгой өвдөж байна.']]},
{id:'taxi',e:'🚕',t:'Такси',d:'Хаяг хэлэх, очих газраа заах',w:[['出租车','chūzūchē','такси'],['去','qù','явах'],['火车站','huǒchēzhàn','галт тэрэгний буудал'],['左边','zuǒbian','зүүн тал'],['右边','yòubian','баруун тал'],['快一点','kuài yìdiǎn','жаахан хурдан'],['停车','tíngchē','зогсох']],c:[['司机','你好，你去哪里？','Nǐ hǎo, nǐ qù nǎlǐ?','Хаашаа явах вэ?'],['乘客','请去火车站。','Qǐng qù huǒchēzhàn.','Галт тэрэгний буудал руу явна уу.']]},
{id:'military',e:'🎖️',t:'Цэргийн орчин',d:'Энгийн заавар, харилцаа',w:[['请','qǐng','гуйя / та'],['听','tīng','сонсох'],['看','kàn','харах'],['站','zhàn','зогсох'],['坐','zuò','суух'],['开始','kāishǐ','эхлэх'],['停止','tíngzhǐ','зогсоох'],['明白','míngbai','ойлгох']],c:[['教官','请听。','Qǐng tīng.','Сонсож өгнө үү.'],['学员','我明白了。','Wǒ míngbai le.','Би ойлголоо.']]}];
const V=[['人','rén','хүн','нэр үг'],['朋友','péngyou','найз','нэр үг'],['家','jiā','гэр / гэр бүл','нэр үг'],['学校','xuéxiào','сургууль','нэр үг'],['工作','gōngzuò','ажил','нэр үг'],['吃','chī','идэх','үйл үг'],['喝','hē','уух','үйл үг'],['说','shuō','ярих','үйл үг'],['学习','xuéxí','сурах','үйл үг'],['买','mǎi','авах','үйл үг'],['去','qù','явах','үйл үг'],['来','lái','ирэх','үйл үг'],['好','hǎo','сайн','тэмдэг нэр'],['大','dà','том','тэмдэг нэр'],['小','xiǎo','жижиг','тэмдэг нэр']];
const app=document.querySelector('#app');let page='home',lesson=L[0],qi=0,score=0;
function say(s){if(!speechSynthesis){alert('Дуугаар унших боломжгүй browser байна.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));draw()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
function cards(){return L.map(x=>`<div class="tile" onclick="openL('${x.id}')"><div class="emoji">${x.e}</div><h3>${x.t}</h3><div class="muted">${x.d}</div><span class="pill">Хичээл үзэх →</span></div>`).join('')}
function draw(){if(page==='home'||page==='lessons'){app.innerHTML=(page==='home'?'<section class="panel"><span class="pill">Өдөр тутмын хятад хэл</span><h2>Сайн байна уу! 🌸</h2><p>Сонсож, дагаж хэлж, шинэ үг сурч, өөрийгөө шалгаарай.</p><button class="primary" onclick="go(\'lessons\')">Хичээл эхлэх</button></section><h2>Сэдэвт хичээлүүд</h2>':'<h2>Сэдэвт хичээлүүд</h2><p class="muted">Өдөр тутмын амьдралд хэрэгтэй 7 сэдэв.</p>')+'<div class="grid">'+cards()+'</div>'}
if(page==='words')app.innerHTML='<h2>Шинэ нэр үг, үйл үг, тэмдэг нэр</h2>'+V.map(w=>`<div class="word row"><div><strong>${w[0]}</strong> <span class="pinyin">${w[1]}</span><div>${w[2]} · ${w[3]}</div></div><button onclick="say('${w[0]}')">🔊 Сонсох</button></div>`).join('');
if(page==='practice')app.innerHTML='<section class="panel"><h2>🎤 Дагалдан хэлэх дасгал</h2><div class="hanzi">去火车站。</div><div class="pinyin">Qù huǒchēzhàn.</div><p>Галт тэрэгний буудал руу явна уу.</p><button class="primary" onclick="say(\'去火车站\')">🔊 Хятад дуудлага</button> <button onclick="record()">🎙️ Өөрөө хэлэх</button><p id="result" class="muted">Яриа таних нь browser-оос хамаарна.</p></section><section class="panel"><h3>Mandarin-ийн дөрвөн аялга</h3><p>1-р mā — өндөр, тэгш</p><p>2-р má — дээш өгсөх</p><p>3-р mǎ — доошлоод дээшлэх</p><p>4-р mà — огцом доошлох</p><button onclick="say(\'mā má mǎ mà\')">🔊 Аялга сонсох</button></section>';
if(page==='quiz'){let Q=[['去 (qù) ямар утгатай вэ?',['Ирэх','Явах','Суух'],1],['火车 (huǒchē) ямар утгатай вэ?',['Онгоц','Автобус','Галт тэрэг'],2],['站 (zhàn) ямар утгатай вэ?',['Буудал','Дэлгүүр','Эмнэлэг'],0],['医生 (yīshēng) ямар утгатай вэ?',['Багш','Эмч','Жолооч'],1],['喝 (hē) ямар утгатай вэ?',['Идэх','Уух','Унтах'],1]],q=Q[qi];app.innerHTML=`<section class="panel"><span class="pill">Тест ${qi+1}/${Q.length}</span><h2>${q[0]}</h2>${q[1].map((a,i)=>`<button style="display:block;width:100%;margin:8px 0;text-align:left" onclick="ans(${i})">${a}</button>`).join('')}<p id="feedback"></p><p>Оноо: ${score}</p></section>`;window.ans=i=>{document.querySelectorAll('#app button').forEach(b=>b.disabled=true);document.querySelector('#feedback').textContent=i===q[2]?(score++,'Зөв хариуллаа! ✓'):'Зөв хариулт: '+q[1][q[2]];let b=document.createElement('button');b.className='primary';b.textContent=qi===Q.length-1?'Дахин эхлэх':'Дараагийн асуулт';b.onclick=()=>{if(qi===Q.length-1){qi=0;score=0}else qi++;draw()};document.querySelector('.panel').append(b)}}
}
window.openL=id=>{lesson=L.find(x=>x.id===id);page='detail';app.innerHTML=`<button onclick="go('lessons')">← Хичээлүүд</button><section class="panel"><div class="emoji">${lesson.e}</div><h2>${lesson.t}</h2><p class="muted">${lesson.d}</p><h3>Шинэ үгс</h3>${lesson.w.map(w=>`<div class="word row"><div><strong>${w[0]}</strong><div class="pinyin">${w[1]}</div>${w[2]}</div><button onclick="say('${w[0]}')">🔊 Сонсох</button></div>`).join('')}<h3>Харилцан яриа</h3>${lesson.c.map(d=>`<div class="dialogue"><b>${d[0]}</b><div class="hanzi">${d[1]}</div><div class="pinyin">${d[2]}</div><p>${d[3]}</p><button onclick="say('${d[1]}')">🔊 Сонсох</button></div>`).join('')}<button class="primary" onclick="go('practice')">Дагалдан хэлэх дасгал</button></section>`;window.scrollTo(0,0)};
function record(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.querySelector('#result').textContent='Энэ browser яриа танихыг дэмжихгүй. Дэмждэг Chrome browser ашиглана уу.';return}let r=new R();r.lang='zh-CN';r.onresult=e=>document.querySelector('#result').textContent='Танигдсан яриа: '+e.results[0][0].transcript;r.onerror=()=>document.querySelector('#result').textContent='Микрофоны зөвшөөрлөө шалгана уу.';r.start()}
draw();
</script></body></html>
